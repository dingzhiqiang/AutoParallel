[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoparallel"
version = "0.1.0"
description = "Auto-parallelism strategy advisor for LLM training and inference"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "dingzhiqiang" },
]
keywords = [
    "llm",
    "distributed",
    "parallelism",
    "training",
    "inference",
    "auto-parallel",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
profiling = ["ray"]
dev = ["ruff", "pytest"]

[project.urls]
Homepage = "https://github.com/dingzhiqiang/AutoParallel"
Repository = "https://github.com/dingzhiqiang/AutoParallel"
Issues = "https://github.com/dingzhiqiang/AutoParallel/issues"

[project.scripts]
autoparallel = "autoparallel.__main__:main"

[tool.setuptools.packages.find]
include = ["autoparallel*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
